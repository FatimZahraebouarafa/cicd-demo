name: Test SSH VmFati

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connexion:
    runs-on: ubuntu-latest
    steps:
      - name: Tester SSH et Docker
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          umask 077
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/s5_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/s5_deploy' EXIT

          ssh -i ~/.ssh/s5_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$SSH_USER@$SSH_HOST" 'whoami && docker ps'
